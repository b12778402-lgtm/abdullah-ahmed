<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>العروض - مكتبة رائف</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

<header class="admin-header">

    <div class="admin-container">

        <div class="admin-logo">
            📚 مكتبة رائف
        </div>

        <div class="admin-title">
            إدارة العروض
        </div>

    </div>

</header>


<main class="admin-container">

    <div class="page-header">

        <div>

            <h1>🔥 العروض</h1>

            <p class="admin-welcome">
                إضافة وتعديل وحذف عروض المكتبة
            </p>

        </div>

        <a
            href="admin.html"
            class="back-btn"
        >
            ← لوحة التحكم
        </a>

    </div>


    <section class="offers-admin">

        <button
            class="add-offer-btn"
            id="addOfferBtn"
            type="button"
        >
            ➕ إضافة عرض جديد
        </button>


        <!-- فورم إضافة العرض -->

        <div
            class="offer-form"
            id="offerForm"
            style="display: none;"
        >

            <h2>
                ➕ إضافة عرض جديد
            </h2>


            <label for="offerName">
                اسم العرض
            </label>

            <input
                type="text"
                id="offerName"
                placeholder="مثال: كراسة 100 ورقة"
            >


            <label for="oldPrice">
                السعر القديم
            </label>

            <input
                type="number"
                id="oldPrice"
                placeholder="مثال: 50"
            >


            <label for="newPrice">
                السعر الجديد
            </label>

            <input
                type="number"
                id="newPrice"
                placeholder="مثال: 35"
            >


            <label for="offerImage">
                صورة العرض
            </label>

            <input
                type="file"
                id="offerImage"
                accept="image/*"
            >


            <div class="offer-form-actions">

                <button
                    class="save-offer-btn"
                    id="saveOfferBtn"
                    type="button"
                >
                    💾 حفظ العرض
                </button>


                <button
                    class="cancel-offer-btn"
                    id="cancelOfferBtn"
                    type="button"
                >
                    إلغاء
                </button>

            </div>

        </div>


        <!-- قائمة العروض -->

        <div
            id="offersList"
            class="offers-list"
        >
        </div>

    </section>

</main>


<footer class="admin-footer">

    <p>
        © 2026 مكتبة رائف
    </p>

</footer>


<script src="offers.js"></script>

<script type="module">
    import { auth } from "./firebase-config.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    onAuthStateChanged(auth, function (user) {
        if (!user) {
            window.location.href = "login.html";
        }
    });
</script>

</body>

</html>
